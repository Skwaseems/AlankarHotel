<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <g fill="none" stroke="#c8a14a" stroke-width="1.5">
    <circle cx="320" cy="320" r="300"/>
    <circle cx="320" cy="320" r="270"/>

    <!-- decorative dot ring -->
    <g fill="#c8a14a" stroke="none">
      <circle cx="320" cy="20" r="3"/>
      <circle cx="320" cy="620" r="3"/>
      <circle cx="20" cy="320" r="3"/>
      <circle cx="620" cy="320" r="3"/>
      <circle cx="108" cy="108" r="2.4"/>
      <circle cx="532" cy="108" r="2.4"/>
      <circle cx="108" cy="532" r="2.4"/>
      <circle cx="532" cy="532" r="2.4"/>
    </g>

    <!-- crossed fork & knife, centered -->
    <g transform="translate(320,320)">
      <g transform="rotate(-25)">
        <line x1="-6" y1="-140" x2="-6" y2="60" stroke-width="3"/>
        <line x1="6" y1="-140" x2="6" y2="60" stroke-width="3"/>
        <line x1="-16" y1="-140" x2="-16" y2="60" stroke-width="3"/>
        <path d="M-20 60 Q-20 90 -6 90 Q8 90 8 60" stroke-width="3"/>
      </g>
      <g transform="rotate(25)">
        <path d="M6 -150 C 30 -130 30 -70 6 -40 L 2 60" stroke-width="3"/>
      </g>
    </g>

    <!-- outer flourish arcs -->
    <path d="M120 60 A 300 300 0 0 1 320 20" stroke-width="1"/>
    <path d="M520 60 A 300 300 0 0 0 320 20" stroke-width="1"/>
    <path d="M120 580 A 300 300 0 0 0 320 620" stroke-width="1"/>
    <path d="M520 580 A 300 300 0 0 1 320 620" stroke-width="1"/>
  </g>
</svg>
