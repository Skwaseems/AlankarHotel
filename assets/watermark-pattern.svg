<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <g fill="none" stroke="#c8a14a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- fork -->
    <g transform="translate(28,30) rotate(-12)">
      <line x1="0" y1="0" x2="0" y2="10"/>
      <line x1="6" y1="0" x2="6" y2="10"/>
      <line x1="12" y1="0" x2="12" y2="10"/>
      <path d="M0 10 Q0 16 6 16 Q12 16 12 10"/>
      <line x1="6" y1="16" x2="6" y2="40"/>
    </g>

    <!-- chili -->
    <g transform="translate(150,20) rotate(18)">
      <path d="M0 0 C -4 6 -4 14 2 20 C 8 26 18 24 20 16 C 22 8 14 -2 6 -2"/>
      <path d="M0 0 C -3 -4 -1 -8 4 -9"/>
    </g>

    <!-- leaf -->
    <g transform="translate(210,60) rotate(30)">
      <path d="M0 16 C 0 4 10 -4 20 0 C 14 10 8 16 0 16 Z"/>
      <line x1="1" y1="15" x2="18" y2="1"/>
    </g>

    <!-- steam swirls -->
    <g transform="translate(60,110)" stroke-width="1.2">
      <path d="M0 20 C 6 14 -4 8 2 2"/>
      <path d="M10 20 C 16 14 6 8 12 2"/>
    </g>

    <!-- plate outline -->
    <g transform="translate(150,140)">
      <circle cx="0" cy="0" r="16"/>
      <circle cx="0" cy="0" r="10"/>
    </g>

    <!-- spoon -->
    <g transform="translate(30,180) rotate(8)">
      <ellipse cx="0" cy="0" rx="6" ry="9"/>
      <line x1="0" y1="9" x2="0" y2="34"/>
    </g>

    <!-- small dot accents -->
    <circle cx="100" cy="60" r="1.6" fill="#c8a14a" stroke="none"/>
    <circle cx="220" cy="130" r="1.6" fill="#c8a14a" stroke="none"/>
    <circle cx="90" cy="200" r="1.6" fill="#c8a14a" stroke="none"/>
    <circle cx="190" cy="210" r="1.6" fill="#c8a14a" stroke="none"/>

    <!-- teacup -->
    <g transform="translate(210,200) rotate(-6)">
      <path d="M0 0 h20 v10 a10 10 0 0 1 -20 0 Z"/>
      <path d="M20 3 q7 0 7 6 t-7 6"/>
    </g>
  </g>
</svg>
